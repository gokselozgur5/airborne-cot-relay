[[test]]
name = "fragment_reassembler_memory_bound"
required-features = ["experimental"]

[[test]]
name = "fragment_reassembly"
required-features = ["experimental"]

[[test]]
name = "fragment_reassembly_integration"
required-features = ["experimental"]

[[test]]
name = "fragmentation"
required-features = ["experimental"]

[[test]]
