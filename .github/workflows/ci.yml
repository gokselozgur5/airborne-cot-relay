name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fmt:
    name: Verify formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: airborne-cot-relay
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt
      - name: Verify formatting
        run: cargo fmt --all -- --check
        working-directory: airborne-cot-relay

  clippy:
    name: Run clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: airborne-cot-relay
      - uses: actions/checkout@v4
        with:
          repository: gokselozgur5/stm32-navcore
          path: stm32-navcore
      - uses: actions/checkout@v4
        with:
          repository: gokselozgur5/sightline-cot
          path: sightline-cot
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: airborne-cot-relay

  test:
    name: Run test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: airborne-cot-relay
      - uses: actions/checkout@v4
        with:
          repository: gokselozgur5/stm32-navcore
          path: stm32-navcore
      - uses: actions/checkout@v4
        with:
          repository: gokselozgur5/sightline-cot
          path: sightline-cot
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Run test suite
        run: cargo test --all-targets
        working-directory: airborne-cot-relay

  doc:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: airborne-cot-relay
      - uses: actions/checkout@v4
        with:
          repository: gokselozgur5/stm32-navcore
          path: stm32-navcore
      - uses: actions/checkout@v4
        with:
          repository: gokselozgur5/sightline-cot
          path: sightline-cot
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Build documentation
        run: cargo doc --no-deps
        working-directory: airborne-cot-relay
